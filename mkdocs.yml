site_name: GitNote
site_url: https://xjbcode.fun/
site_description: GitNote 知识库（MkDocs Material 原型）
docs_dir: wiki-docs
site_dir: mkdocs_site
use_directory_urls: true

exclude_docs: |
  mkdocs_site/
  Notes/未命名.md
  **/node_modules/
theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色
  features:
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy       # 代码块复制按钮

hooks:
  - hooks/number_headings.py

plugins:
  - search:
      lang:
        - en
        - zh
  - awesome-pages

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:        # LaTeX 数学（KaTeX 渲染）
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid          # Mermaid 图
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/mermaid@11.2.1/dist/mermaid.min.js
extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

extra:
  generator: false
